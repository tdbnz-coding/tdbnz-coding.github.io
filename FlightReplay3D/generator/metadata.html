<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>FR24 Dual‑Mode Metadata Extractor</title>
  <style>
    body {
      background:#0b1020;
      color:#eee;
      font-family:system-ui;
      padding:20px;
    }
    textarea {
      width:100%;
      padding:10px;
      margin-top:10px;
      font-size:16px;
      border-radius:4px;
      border:1px solid #374151;
      background:#111827;
      color:#eee;
    }
    button {
      width:100%;
      padding:12px;
      margin-top:12px;
      font-size:18px;
      border-radius:4px;
      border:1px solid #374151;
      background:#1f2937;
      color:#fff;
      cursor:pointer;
      transition:0.2s;
    }
    button:hover {
      background:#374151;
    }
    pre {
      background:#111827;
      padding:15px;
      border-radius:6px;
      white-space:pre-wrap;
      border:1px solid #374151;
      margin-top:20px;
    }
    h2 {
      margin-top:0;
    }
  </style>
</head>
<body>

<h2>FR24 Dual‑Mode Metadata Extractor</h2>
<p>Paste the FULL HTML source of any FlightRadar24 page (flight, aircraft, or playback).</p>

<textarea id="htmlInput" rows="18" placeholder="Paste FR24 page source here"></textarea>

<button id="extractBtn">Extract Metadata</button>

<h3>Generated track.json:</h3>
<pre id="output"></pre>

<script src="metadata.js"></script>

<script>
  // Ensure button is clickable even if JS loads late
  document.getElementById("extractBtn").addEventListener("click", function() {
    if (typeof extract === "function") {
      extract();
    } else {
      document.getElementById("output").textContent =
        "ERROR: metadata.js did not load or extract() is missing.";
    }
  });
</script>

</body>
</html>
