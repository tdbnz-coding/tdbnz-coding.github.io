<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Flight Folder Generator</title>
  <style>
    body { background:#0b1020; color:#eee; font-family:system-ui; padding:20px; }
    input, button { padding:8px; margin:6px 0; width:100%; font-size:16px; }
    button { background:#1f2937; color:#fff; border:1px solid #374151; }
    pre { background:#111827; padding:15px; border-radius:6px; }
  </style>
</head>
<body>

<h2>Flight Folder Generator</h2>
<p>Enter flight number + date to generate a clean folder name + required files.</p>

<label>Flight Number:</label>
<input id="flight" type="text" placeholder="e.g. ANZ501">

<label>Date (YYYY-MM-DD):</label>
<input id="date" type="text" placeholder="e.g. 2026-07-30">

<button onclick="generate()">Generate Folder</button>

<h3>Output:</h3>
<pre id="output"></pre>

<script src="make-flight.js"></script>

</body>
</html>
