name: Auto IPTV Trial (Thomas & Duncan)

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests

      - name: Run Python trial updater
        run: python3 trialtv123/scripts/update.py

      - name: Commit updated M3U files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update thomas.m3u & duncan.m3u"
          file_pattern: |
            trialtv123/thomas.m3u
            trialtv123/duncan.m3u
          push_options: '--force'
