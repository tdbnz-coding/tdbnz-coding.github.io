name: Generate EPG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y mono-runtime unzip wget

      - name: Download WebGrab+Plus
        run: |
          wget https://www.webgrabplus.com/sites/default/files/download/updates/WebGrabPlus_V3.2_install.zip
          unzip WebGrabPlus_V3.2_install.zip -d wg

      - name: Copy config + siteini
        run: |
          cp iptv/WebGrab++.config.xml wg/
          cp -r iptv/siteini.pack wg/

      - name: Run WebGrab+Plus
        run: |
          cd wg
          mono WebGrab+Plus.exe

      - name: Save EPG to /iptv/epg/
        run: |
          cp wg/guide.xml iptv/epg/epg.xml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add iptv/epg/epg.xml
          git commit -m "EPG update"
          git push
