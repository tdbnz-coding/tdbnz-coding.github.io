name: Generate EPG (WebGrabPlus V5.5)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install .NET SDK 8
        run: |
          wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --channel 8.0 --install-dir /usr/share/dotnet

      - name: Fix SSL + CA certificates (WG++ internet fix)
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates libssl-dev

      - name: Download WebGrabPlus V5.5
        run: |
          wget https://webgrabplus.com/sites/default/files/download/SW/V5.5.0/WebGrabPlus_5.5_install.tar.gz
          tar -zxvf WebGrabPlus_5.5_install.tar.gz -C $HOME

      - name: Install WebGrabPlus
        run: |
          cd $HOME/.wg++
          ./install.sh

      - name: Copy config + siteini
        run: |
          cp iptv/WebGrab++.config.xml $HOME/.wg++
          cp -r iptv/siteini.pack $HOME/.wg++

      - name: Run WebGrabPlus
        run: |
          cd $HOME/.wg++
          ./run.net.sh

      - name: Save EPG to /iptv/epg/
        run: |
          cp $HOME/.wg++/guide.xml iptv/epg/epg.xml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add iptv/epg/epg.xml
          git commit -m "EPG update"
          git push
