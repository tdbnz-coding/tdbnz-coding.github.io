name: Bang TV Sports Daily

on:
  schedule:
    # 10 PM NZ local time (runs at 10 AM UTC)
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force post schedule?"
        required: false
        default: "no"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      - env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python bangtv/scraper.py ${{ github.event.inputs.force == 'yes' && 'force' || '' }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update last.json"
          file_pattern: bangtv/last.json
