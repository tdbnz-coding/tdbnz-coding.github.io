<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading…</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background: #f8f9fa; padding-top: 40px; }
    .card { border-radius: 12px; }
    .cta-btn { font-size: 18px; padding: 12px; }
    .countdown { font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <div class="text-center mb-4">
    <h1 class="fw-bold">Welcome from X 👋</h1>
    <p class="text-muted">Powered by TDBNZ Media</p>
  </div>

  <div class="card shadow p-4">
    <h2 id="title" class="fw-bold"></h2>
    <p id="summary" class="mt-3"></p>

    <!-- READ ARTICLE BUTTON -->
    <a id="cta" href="#" target="_blank" class="btn btn-dark w-100 cta-btn mt-4">
      👉 Read the full article
    </a>

    <!-- COPY LINK BUTTON -->
    <button id="copyBtn" class="btn btn-secondary w-100 mt-3">
      📋 Copy Article Link
    </button>

    <hr class="my-4">

    <div class="text-center">
      <p class="mb-2">Follow me on X for more updates:</p>
      <a href="https://x.com/tdbnzmedia" target="_blank" class="btn btn-primary w-100">
        🔵 Follow @tdbnzmedia
      </a>
    </div>

    <p class="text-center mt-3 text-muted countdown">
      Redirecting in <span id="timer">5</span> seconds…
    </p>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);

  const title = params.get("title") || "Article";
  const summary = params.get("summary") || "Read the full article.";
  const url = params.get("url") || "#";

  document.title = title;
  document.getElementById("title").innerText = title;
  document.getElementById("summary").innerText = summary;
  document.getElementById("cta").href = url;

  // ⭐ COPY LINK BUTTON
  document.getElementById("copyBtn").addEventListener("click", () => {
    navigator.clipboard.writeText(url);
    alert("Article link copied!");
  });

  // ⭐ COUNTDOWN + AUTO-REDIRECT
  let seconds = 5;
  const timerEl = document.getElementById("timer");

  const countdown = setInterval(() => {
    seconds--;
    timerEl.innerText = seconds;

    if (seconds <= 0) {
      clearInterval(countdown);
      if (url && url !== "#") {
        window.location.href = url;
      }
    }
  }, 1000);
</script>

</body>
</html>
