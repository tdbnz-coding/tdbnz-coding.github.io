<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Landing Link Generator</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
  body { padding: 20px; background: #f8f9fa; }
  .card { border-radius: 12px; }
  textarea { font-size: 15px; }
</style>
</head>
<body>

<div class="container">
  <h2 class="mb-4 fw-bold">X Landing Link Generator</h2>

  <div class="card shadow p-4">
    <label class="fw-bold mb-2">Article URL</label>
    <input id="articleUrl" type="text" class="form-control" placeholder="Paste article URL">

    <button class="btn btn-dark w-100 mt-3" onclick="generate()">Generate Link</button>

    <hr class="my-4">

    <label class="fw-bold">Generated Tweet</label>
    <textarea id="output" class="form-control" rows="6" readonly></textarea>

    <button class="btn btn-secondary w-100 mt-3" onclick="copyText()">📋 Copy to Clipboard</button>

    <button class="btn btn-primary w-100 mt-3" onclick="tweet()">🐦 Tweet on X</button>
  </div>
</div>

<script>
async function generate() {
  const url = document.getElementById("articleUrl").value;
  if (!url) return alert("Enter an article URL");

  try {
    const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
    const data = await response.json();
    const html = data.contents;

    const parser = new DOMParser();
    const doc = parser.parseFromString(html, "text/html");

    const title = doc.querySelector("title")?.innerText || "Article";
    const summary = doc.querySelector("p")?.innerText || "Read the full article.";

    const base = "https://tdbnz-coding.github.io/X/News/landing";

    const params = new URLSearchParams({
      title: title,
      summary: summary,
      url: url
    });

    const landingLink = `${base}?${params.toString()}`;

    const keywords = title.split(" ").slice(0, 3).map(w => "#" + w.replace(/[^a-zA-Z0-9]/g, ""));
    const hashtags = keywords.join(" ");

    const tweetText = `${title}\n\n${summary}\n\n${landingLink}\n\n${hashtags}`;

    document.getElementById("output").value = tweetText;

  } catch (e) {
    alert("Could not fetch article. Some sites block scraping.");
  }
}

function copyText() {
  const text = document.getElementById("output").value;
  navigator.clipboard.writeText(text);
  alert("Copied to clipboard!");
}

function tweet() {
  const text = document.getElementById("output").value;
  const encoded = encodeURIComponent(text);
  window.open(`https://x.com/intent/tweet?text=${encoded}`, "_blank");
}
</script>

</body>
</html>
