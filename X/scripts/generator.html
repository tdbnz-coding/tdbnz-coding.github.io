<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Landing Link Generator</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
  body { padding: 20px; background: #f8f9fa; }
  .card { border-radius: 12px; }
  textarea { font-size: 15px; }

  .tweet-btn {
    font-size: 18px;
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
</style>
</head>
<body>

<div class="container">
  <h2 class="mb-4 fw-bold">X Landing Link Generator</h2>

  <div class="card shadow p-4">

    <!-- ARTICLE URL -->
    <label class="fw-bold mb-2">Article URL</label>
    <input id="articleUrl" type="text" class="form-control" placeholder="Paste article URL">

    <!-- COPY URL BUTTON -->
    <button class="btn btn-secondary w-100 mt-2" onclick="copyURL()">
      📋 Copy Article URL Only
    </button>

    <!-- TITLE -->
    <label class="fw-bold mt-3 mb-2">Article Title</label>
    <input id="articleTitle" type="text" class="form-control" placeholder="Enter article title">

    <!-- SUMMARY -->
    <label class="fw-bold mt-3 mb-2">Article Summary</label>
    <textarea id="articleSummary" class="form-control" rows="3" placeholder="Enter article summary"></textarea>

    <button class="btn btn-dark w-100 mt-3" onclick="generate()">Generate Tweet</button>

    <hr class="my-4">

    <!-- GENERATED TWEET -->
    <label class="fw-bold">Generated Tweet</label>
    <textarea id="output" class="form-control" rows="6" readonly></textarea>

    <!-- AUTO HASHTAGS BOX -->
    <label class="fw-bold mt-3">Auto Hashtags</label>
    <textarea id="hashtagsBox" class="form-control" rows="2" readonly></textarea>

    <!-- COPY FULL TWEET -->
    <button class="btn btn-secondary w-100 mt-3" onclick="copyText()">📋 Copy Full Tweet</button>

    <!-- COPY LANDING LINK ONLY -->
    <button class="btn btn-secondary w-100 mt-2" onclick="copyLandingLink()">
      🔗 Copy Landing Link Only
    </button>

    <!-- TWEET BUTTON -->
    <button class="btn btn-primary w-100 mt-3 tweet-btn" onclick="tweet()">
      <svg width="22" height="22" viewBox="0 0 1200 1227" style="vertical-align: middle;">
        <path fill="#ffffff" d="M714 0L...Z"></path>
      </svg>
      Tweet on X
    </button>
  </div>
</div>

<script>
let landingLinkGlobal = "";

function generate() {
  const url = document.getElementById("articleUrl").value.trim();
  const title = document.getElementById("articleTitle").value.trim();
  const summary = document.getElementById("articleSummary").value.trim();

  if (!url || !title || !summary) {
    alert("Please fill in URL, title, and summary.");
    return;
  }

  const base = "https://tdbnz-coding.github.io/X/News/landing";

  const params = new URLSearchParams({
    title: title,
    summary: summary,
    url: url
  });

  const landingLink = `${base}?${params.toString()}`;
  landingLinkGlobal = landingLink;

  const keywords = title.split(" ").slice(0, 3).map(w => "#" + w.replace(/[^a-zA-Z0-9]/g, ""));
  const hashtags = keywords.join(" ");

  const tweetText = `${title}\n\n${summary}\n\n${landingLink}\n\n${hashtags}`;

  document.getElementById("output").value = tweetText;
  document.getElementById("hashtagsBox").value = hashtags;
}

function copyText() {
  const text = document.getElementById("output").value;
  navigator.clipboard.writeText(text);
  alert("Tweet copied!");
}

function copyURL() {
  const url = document.getElementById("articleUrl").value.trim();
  if (!url) {
    alert("No URL to copy!");
    return;
  }
  navigator.clipboard.writeText(url);
  alert("Article URL copied!");
}

function copyLandingLink() {
  if (!landingLinkGlobal) {
    alert("Generate the tweet first!");
    return;
  }
  navigator.clipboard.writeText(landingLinkGlobal);
  alert("Landing link copied!");
}

function tweet() {
  const text = document.getElementById("output").value;
  const encoded = encodeURIComponent(text);
  window.open(`https://x.com/intent/tweet?text=${encoded}`, "_blank");
}
</script>

</body>
</html>
