<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Landing Link Generator</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
  body { padding: 20px; background: #f8f9fa; }
  .card { border-radius: 12px; }
  textarea { font-size: 15px; }
  .tweet-btn {
    font-size: 18px;
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  #imagePreview {
    width: 100%;
    max-height: 200px;
    object-fit: cover;
    border-radius: 10px;
    margin-top: 10px;
    display: none;
  }
</style>
</head>
<body>

<div class="container">
  <h2 class="mb-4 fw-bold">X Landing Link Generator</h2>

  <div class="card shadow p-4">

    <!-- ARTICLE URL -->
    <label class="fw-bold mb-2">Article URL</label>
    <input id="articleUrl" type="text" class="form-control" placeholder="Paste article URL">

    <!-- URL WARNING -->
    <p id="urlWarning" class="text-danger mt-1" style="display:none;">
      ⚠️ Invalid URL. Must start with http:// or https://  
    </p>

    <p class="text-muted mt-1">
      🔍 Always double‑check the URL before posting.
    </p>

    <!-- COPY URL BUTTON -->
    <button class="btn btn-secondary w-100 mt-2" onclick="copyURL()">
      📋 Copy Article URL Only
    </button>

    <!-- IMAGE URL -->
    <label class="fw-bold mt-3 mb-2">Image URL (optional)</label>
    <input id="imageUrl" type="text" class="form-control" placeholder="Paste image URL">

    <!-- IMAGE URL WARNING -->
    <p id="imgWarning" class="text-danger mt-1" style="display:none;">
      ⚠️ Image URL must start with http:// or https://  
    </p>

    <!-- IMAGE PREVIEW -->
    <img id="imagePreview" alt="Image preview">

    <!-- TITLE -->
    <label class="fw-bold mt-3 mb-2">Article Title</label>
    <input id="articleTitle" type="text" class="form-control" placeholder="Enter article title">

    <!-- SUMMARY -->
    <label class="fw-bold mt-3 mb-2">Article Summary</label>
    <textarea id="articleSummary" class="form-control" rows="3" placeholder="Enter article summary"></textarea>

    <button class="btn btn-dark w-100 mt-3" onclick="generate()">Generate Tweet</button>

    <hr class="my-4">

    <!-- GENERATED TWEET -->
    <label class="fw-bold">Generated Tweet</label>
    <textarea id="output" class="form-control" rows="6" readonly></textarea>

    <!-- AUTO HASHTAGS BOX -->
    <label class="fw-bold mt-3">Auto Hashtags</label>
    <textarea id="hashtagsBox" class="form-control" rows="2" readonly></textarea>

    <!-- COPY FULL TWEET -->
    <button class="btn btn-secondary w-100 mt-3" onclick="copyText()">📋 Copy Full Tweet</button>

    <!-- COPY LANDING LINK ONLY -->
    <button class="btn btn-secondary w-100 mt-2" onclick="copyLandingLink()">
      🔗 Copy Landing Link Only
    </button>

    <!-- TWEET BUTTON -->
    <button class="btn btn-primary w-100 mt-3 tweet-btn" onclick="tweet()">
      Tweet on X
    </button>
  </div>
</div>

<script>
let landingLinkGlobal = "";

// URL VALIDATION
document.getElementById("articleUrl").addEventListener("input", () => {
  const url = document.getElementById("articleUrl").value.trim();
  const warn = document.getElementById("urlWarning");

  warn.style.display = (url.startsWith("http://") || url.startsWith("https://")) ? "none" : "block";
});

// IMAGE URL VALIDATION + PREVIEW
document.getElementById("imageUrl").addEventListener("input", () => {
  const imgUrl = document.getElementById("imageUrl").value.trim();
  const warn = document.getElementById("imgWarning");
  const preview = document.getElementById("imagePreview");

  if (!imgUrl) {
    warn.style.display = "none";
    preview.style.display = "none";
    return;
  }

  if (imgUrl.startsWith("http://") || imgUrl.startsWith("https://")) {
    warn.style.display = "none";
    preview.src = imgUrl;
    preview.style.display = "block";
  } else {
    warn.style.display = "block";
    preview.style.display = "none";
  }
});

function generate() {
  const url = document.getElementById("articleUrl").value.trim();
  const title = document.getElementById("articleTitle").value.trim();
  const summary = document.getElementById("articleSummary").value.trim();
  const imgUrl = document.getElementById("imageUrl").value.trim();

  if (!url || !title || !summary) {
    alert("Please fill in URL, title, and summary.");
    return;
  }

  const base = "https://tdbnz-coding.github.io/X/News/landing";

  const params = new URLSearchParams({
    title: title,
    summary: summary,
    url: url
  });

  const landingLink = `${base}?${params.toString()}`;
  landingLinkGlobal = landingLink;

  const keywords = title.split(" ").slice(0, 3).map(w => "#" + w.replace(/[^a-zA-Z0-9]/g, ""));
  const hashtags = keywords.join(" ");

  let tweetText = `${title}\n\n${summary}\n\n${landingLink}\n\n${hashtags}`;

  if (imgUrl) {
    tweetText += `\n\n${imgUrl}`;
  }

  document.getElementById("output").value = tweetText;
  document.getElementById("hashtagsBox").value = hashtags;
}

function copyText() {
  navigator.clipboard.writeText(document.getElementById("output").value);
  alert("Tweet copied!");
}

function copyURL() {
  const url = document.getElementById("articleUrl").value.trim();
  if (!url) return alert("No URL to copy!");
  navigator.clipboard.writeText(url);
  alert("Article URL copied!");
}

function copyLandingLink() {
  if (!landingLinkGlobal) return alert("Generate the tweet first!");
  navigator.clipboard.writeText(landingLinkGlobal);
  alert("Landing link copied!");
}

function tweet() {
  const text = document.getElementById("output").value;
  const encoded = encodeURIComponent(text);
  window.open(`https://x.com/intent/tweet?text=${encoded}`, "_blank");
}
</script>

</body>
</html>
