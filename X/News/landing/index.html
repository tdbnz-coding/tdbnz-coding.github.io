<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading…</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { 
      background: #f4f4f4; 
      padding-top: 40px; 
      font-family: 'Segoe UI', sans-serif;
    }

    .card { 
      border-radius: 20px; 
      padding: 35px; 
      background: #ffffff;
      max-width: 700px;
      margin: auto;
    }

    .header-title {
      font-size: 30px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 5px;
    }

    .header-subtitle {
      text-align: center;
      font-size: 16px;
      margin-bottom: 25px;
    }

    .header-subtitle a {
      text-decoration: none;
      font-weight: 600;
      color: #007bff;
    }

    /* ⭐ PREMIUM RESPONSIVE IMAGE */
    .preview-img {
      width: 100%;
      height: auto;
      max-height: 350px;
      object-fit: contain;
      border-radius: 16px;
      margin-bottom: 25px;
      display: none;
      background: #f0f0f0;
      padding: 10px;
    }

    .premium-title {
      font-size: 26px;
      font-weight: 700;
      text-align: center;
      margin-top: 10px;
    }

    .premium-summary {
      font-size: 18px;
      text-align: center;
      margin-top: 15px;
      color: #555;
    }

    .cta-btn { 
      font-size: 18px; 
      padding: 14px; 
      border-radius: 12px;
    }

    .countdown {
      text-align: center;
      font-size: 16px;
      margin-top: 20px;
      color: #6c757d;
    }

    @media (max-width: 600px) {
      .premium-title { font-size: 22px; }
      .premium-summary { font-size: 16px; }
      .header-title { font-size: 26px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card shadow">

    <!-- HEADER -->
    <h1 class="header-title">Welcome from X 👋</h1>
    <p class="header-subtitle">
      Powered by 
      <a href="https://x.com/tdbnzmedia" target="_blank">TDBNZ Media</a>
    </p>

    <!-- IMAGE PREVIEW -->
    <img id="previewImage" class="preview-img" alt="Preview">

    <!-- TITLE -->
    <h2 id="title" class="premium-title"></h2>

    <!-- SUMMARY -->
    <p id="summary" class="premium-summary"></p>

    <!-- READ ARTICLE BUTTON -->
    <a id="cta" href="#" target="_blank" class="btn btn-dark w-100 cta-btn mt-4">
      👉 Read the full article
    </a>

    <hr class="my-4">

    <!-- FOLLOW BUTTON -->
    <div class="text-center">
      <p class="mb-2">Follow me on X for more updates:</p>
      <a href="https://x.com/tdbnzmedia" target="_blank" class="btn btn-primary w-100">
        🔵 Follow @tdbnzmedia
      </a>
    </div>

    <!-- COUNTDOWN -->
    <p class="countdown">
      Redirecting in <span id="timer">7</span> seconds…
    </p>

  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);

  const title = params.get("title") || "Article";
  const summary = params.get("summary") || "Read the full article.";
  const url = params.get("url") || "#";
  const image = params.get("image");

  // Set content
  document.title = title;
  document.getElementById("title").innerText = title;
  document.getElementById("summary").innerText = summary;
  document.getElementById("cta").href = url;

  // ⭐ IMAGE PREVIEW LOGIC
  if (image && (image.startsWith("http://") || image.startsWith("https://"))) {
    const imgEl = document.getElementById("previewImage");
    imgEl.src = image;
    imgEl.style.display = "block";
  }

  // ⭐ COUNTDOWN + REDIRECT (7 seconds)
  let seconds = 7;
  const timerEl = document.getElementById("timer");

  const countdown = setInterval(() => {
    seconds--;
    timerEl.innerText = seconds;

    if (seconds <= 0) {
      clearInterval(countdown);
      if (url && url !== "#") {
        window.location.href = url;
      }
    }
  }, 1000);
</script>

</body>
</html>
