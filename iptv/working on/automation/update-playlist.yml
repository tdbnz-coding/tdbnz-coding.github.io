name: Daily Playlist Update

on:
  schedule:
    - cron: "0 14 * * *"   # 2 AM NZT
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download NZ TV + Radio
        run: |
          curl -s -o iptv/raw-tv.m3u8 https://i.mjh.nz/nz/raw-tv.m3u8
          curl -s -o iptv/raw-radio.m3u8 https://i.mjh.nz/nz/raw-radio.m3u8

      - name: Build NZ TV section
        run: |
          awk '
            BEGIN { RS=""; FS="\n" }
            /^#EXTINF/ {
              name=$1
              sub(/.*,\s*/, "", name)
              blocks[name]=$0 "\n" $2
            }
            END {
              print "# --- 🇳🇿 News – New Zealand ---"
              n=asorti(blocks, sorted)
              for(i=1;i<=n;i++){
                block=blocks[sorted[i]]
                gsub(/group-title="[^"]*"/, "group-title=\"New Zealand 🇳🇿\"", block)
                print block "\n"
              }
            }
          ' iptv/raw-tv.m3u8 > iptv/nz-tv-sorted.m3u

      - name: Build NZ Radio section
        run: |
          awk '
            BEGIN { RS=""; FS="\n" }
            /^#EXTINF/ {
              name=$1
              sub(/.*,\s*/, "", name)
              blocks[name]=$0 "\n" $2
            }
            END {
              print "# --- 📻 News – New Zealand Radio ---"
              n=asorti(blocks, sorted)
              for(i=1;i<=n;i++){
                block=blocks[sorted[i]]
                gsub(/group-title="[^"]*"/, "group-title=\"New Zealand Radio 📻🇳🇿\"", block)
                print block "\n"
              }
            }
          ' iptv/raw-radio.m3u8 > iptv/nz-radio-sorted.m3u

      - name: Merge + Sort Playlist
        run: |
          cp "iptv/playlist - with folders.m3u" iptv/playlist-new.m3u

          # Remove old NZ sections
          sed -i '/# --- 🇳🇿 News – New Zealand ---/,/# --- 📻 News – New Zealand Radio ---/d' iptv/playlist-new.m3u
          sed -i '/# --- 📻 News – New Zealand Radio ---/,/END OF PLAYLIST/d' iptv/playlist-new.m3u

          # Remove old END OF PLAYLIST
          sed -i '/# END OF PLAYLIST/d' iptv/playlist-new.m3u

          # Add timestamp at top
          sed -i "1i # Last Updated: $(TZ='Pacific/Auckland' date '+%Y-%m-%d %H:%M:%S NZT')" iptv/playlist-new.m3u

          # Insert NZ sections
          echo "" >> iptv/playlist-new.m3u
          cat iptv/nz-tv-sorted.m3u >> iptv/playlist-new.m3u
          echo "" >> iptv/playlist-new.m3u
          cat iptv/nz-radio-sorted.m3u >> iptv/playlist-new.m3u

          # Sort categories + channels safely
          awk '
            /^# ---/ {
              current=$0
              categories[current]=""
              next
            }
            /^#EXTINF/ {
              block=$0
              getline url
              full=block "\n" url
              name=block
              sub(/.*,\s*/, "", name)
              channels[current][name]=full
              next
            }
            END {
              # Sort categories alphabetically
              c=asorti(categories, sortedCats)
              for(i=1;i<=c;i++){
                cat=sortedCats[i]
                print cat
                # Sort channels alphabetically
                n=asorti(channels[cat], sortedCh)
                for(j=1;j<=n;j++){
                  print channels[cat][sortedCh[j]] "\n"
                }
              }
            }
          ' iptv/playlist-new.m3u > iptv/playlist-sorted.m3u

          mv iptv/playlist-sorted.m3u iptv/playlist-new.m3u

          # Add END OF PLAYLIST
          echo "############################################################" >> iptv/playlist-new.m3u
          echo "# END OF PLAYLIST" >> iptv/playlist-new.m3u
          echo "############################################################" >> iptv/playlist-new.m3u

      - name: Replace old playlist
        run: |
          mv iptv/playlist-new.m3u "iptv/playlist - with folders.m3u"

      - name: Commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add "iptv/playlist - with folders.m3u"
          git commit -m "Daily playlist update"
          git push
